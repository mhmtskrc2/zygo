name: ci

# The matrix exists because the development machines cannot test several
# things: the
# measurement environment was kernel 5.10 without KVM, so Landlock, cgroup.kill,
# memory.peak, unprivileged overlayfs and the `vm` backend were never exercised.
# Each of those has a job here that will exercise it, and the kernel each runner
# provides is printed so a green tick can be checked rather than trusted.

on:
  push:
    branches: [main]
  pull_request:
  # Several jobs here depend on what a runner happens to provide — a kernel
  # version, a `/dev/kvm`, a working `runsc` download. Being able to re-run
  # the matrix without an empty commit is worth one line.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege by default (S-13). Without this the token is whatever the
# repository's default is, which for many repositories is write — handed to
# every third-party action in every job. A job that needs more asks for it.
permissions:
  contents: read

# One run per ref. A push that supersedes another cancels it rather than
# queueing behind it, which on a repository with long Linux jobs is the
# difference between minutes and an hour.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The dependency tree, against the RustSec advisory database and the
  # licence and source policy in `deny.toml`. A pinned release of cargo-deny,
  # checked against its published digest, rather than a third-party action.
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: supply chain (cargo deny)
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  deny.tar.gz" | sha256sum -c -
          tar xzf deny.tar.gz
          sudo install -m 0755 "$name/cargo-deny" /usr/local/bin/cargo-deny
      - name: Advisories, licences, bans, sources
        run: cargo deny --locked check
      - name: And with every feature on, which brings in libkrun
        run: cargo deny --locked --all-features check sources licenses

  # Everything platform independent: spec, protocol, image store, mount plan.
  # Runs on macOS too, because that is where most development happens and the
  # Linux-only code must keep compiling there.
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04      # kernel 6.8 — Landlock v4+, cgroup.kill
            label: linux/x86_64
          - os: ubuntu-22.04      # kernel 5.15 — the oldest a runner offers; the floor is 5.3
            label: linux/x86_64/old
          - os: ubuntu-24.04-arm
            label: linux/aarch64
          - os: macos-14
            label: macos/aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: unit (${{ matrix.label }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Report what this runner actually is
        run: |
          uname -a
          if [ -f /proc/sys/kernel/osrelease ]; then
            echo "kernel: $(cat /proc/sys/kernel/osrelease)"
            echo "userns: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo '?')"
            echo "cgroup: $(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo 'not v2')"
            echo "lsm:    $(cat /sys/kernel/security/lsm 2>/dev/null || echo '?')"
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The API docs, with a dangling intra-doc link as an error. A link that
      # points nowhere is a comment that lies, and rustdoc is the only thing
      # that ever follows them. `--no-deps`: the dependencies' docs are theirs.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace

      - name: Python agent unit tests
        run: python3 -W error::ResourceWarning -m unittest discover -s agents/python

      # The protocol's own suite, against both reference agents. The `sh` one
      # shares no code with Zygo, which is what makes "language independent"
      # something other than an assertion.
      - name: Protocol conformance
        run: make conformance

      # The third implementation, and the one that cannot `fork()`: the Node
      # agent keeps a pool of pre-loaded workers instead. `make
      # conformance-node` runs it in a container because the musl binary has
      # to cross into `node:22-slim`; on a runner that already has Node there
      # is nothing to cross.
      - name: Protocol conformance (Node)
        shell: bash
        run: |
          if ! command -v node >/dev/null; then
            echo "no node on this runner — skipped"
            exit 0
          fi
          ./target/release/zygo agent test node \
            --script examples/agents/conformance/script.js \
            --script-spawn examples/agents/conformance/spawn.js -- \
            agents/node/zygo_agent.js examples/agents/conformance/handler.js

      # The macOS shim, end to end against a real Linux VM. It will skip here
      # and say so: GitHub's hosted macOS runners are themselves virtual
      # machines and offer no nested virtualization, so Lima cannot boot. The
      # shim's own decisions — what forwards, what a path maps to, what
      # `limactl` is asked — are plain functions covered by `cargo test`
      # above, on every platform in the matrix.
      - name: macOS shim
        if: runner.os == 'macOS'
        run: make verify-shim

  # The floor `rust-version` declares, actually compiled with. The number
  # drifted once — 1.85 was declared for code that needed 1.88, and nobody
  # noticed because every machine that ran `cargo check` was newer. Nothing
  # was building with the toolchain the manifest named; now something is. The
  # version is read from `Cargo.toml` rather than repeated here, so there is
  # one copy to bump, and the job goes red the day a dependency or a language
  # feature moves the real floor above the declared one.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: msrv (rust-version)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "rust-version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable; the toolchain is the input
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `check` rather than `build`: the question is whether the code compiles
      # on the floor, not whether it links. `--all-targets` so the tests, which
      # use the same language features, are asked too; `--locked` so the answer
      # is about the dependency versions that are checked in.
      - run: cargo check --workspace --all-targets --locked
      # Cheap after the check above — the same compilation, linked into test
      # binaries — and it catches a dev-dependency above the floor.
      - run: cargo test --workspace --no-run --locked

  # The launcher can only be exercised on Linux, and the interesting question is
  # whether it works *without* root — requirement N5.
  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            privilege: rootless
          - os: ubuntu-24.04
            privilege: root
          - os: ubuntu-22.04
            privilege: rootless
          - os: ubuntu-24.04-arm
            privilege: rootless
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: launcher (${{ matrix.os }}, ${{ matrix.privilege }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`.
      # It lets an unprivileged process create a user namespace and then
      # refuses the first mount inside it, so every sandbox dies on `mount
      # --make-rprivate /: Permission denied` — which names neither AppArmor
      # nor user namespaces. `zygo doctor` reports it now; this turns it off,
      # because this runner exists to run sandboxes and the confinement that
      # matters is the one Zygo builds inside them.
      - name: Let unprivileged user namespaces mount
        run: |
          before=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "not present")
          echo "apparmor_restrict_unprivileged_userns was: $before"
          if [ "$before" != "not present" ] && [ "$before" != 0 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Environment
        run: |
          cargo run --release --bin zygo -- doctor || true
          echo "subuid: $(grep "^$USER:" /etc/subuid 2>/dev/null || echo 'none')"

      - run: cargo build --release

      # The scripts default to `/src`, which is where `make` mounts the
      # checkout inside its containers; here the checkout is the workspace.
      - name: Isolation and limits
        run: |
          . tests/linux/ci_cgroup.sh
          install -Dm755 target/release/zygo tests/linux/bin/zygo-linux-musl
          if [ "${{ matrix.privilege }}" = root ]; then
            sudo -E sh tests/linux/verify_launcher.sh
          else
            sh tests/linux/verify_launcher.sh
          fi
        env:
          # Its own tree, because the root entry runs this one step under
          # `sudo` and every step after it unprivileged. Sharing one directory
          # left those steps unable to write it — and an escape suite that
          # cannot start a sandbox reported *16 escapes*.
          ZYGO_DATA_HOME: /tmp/zygo-launcher-${{ matrix.privilege }}
          SRC: ${{ github.workspace }}

      - name: Escape suite
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . tests/linux/ci_cgroup.sh
          install -Dm755 target/release/zygo tests/linux/bin/zygo-linux-musl
          sh tests/linux/escape_suite.sh
        env:
          ZYGO_DATA_HOME: /tmp/zygo-ci
          SRC: ${{ github.workspace }}

      # Every syscall number against all three profiles, comparing what the
      # kernel answered. The escape suite attempts the vectors somebody
      # thought of; this one needs no imagination.
      - name: Syscall sweep
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . tests/linux/ci_cgroup.sh
          bash tests/linux/fuzz_syscalls.sh
        env:
          ZYGO_DATA_HOME: /tmp/zygo-ci
          SRC: ${{ github.workspace }}

      # The gvisor backend against a real runsc, including the same command
      # run on both backends (requirement N8). Downloads ~114 MB.
      - name: gVisor backend
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . tests/linux/ci_cgroup.sh
          sh tests/linux/verify_gvisor.sh
        env:
          ZYGO_DATA_HOME: /tmp/zygo-gvisor
          SRC: ${{ github.workspace }}

      # The only suite where the client process exits between steps, which is
      # what catches failures living in the supervisor's threading rather than
      # in the sandbox — `PDEATHSIG` firing on thread exit was found this way
      # and no in-process test can see it.
      - name: Supervisor lifecycle
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . tests/linux/ci_cgroup.sh
          install -Dm755 target/release/zygo tests/linux/bin/zygo-linux-musl
          # Not fatal: `passt` is not packaged before Ubuntu 23.04, and the
          # suite has a prerequisite check that skips the egress section and
          # says so. A failed `apt-get` here ended the whole step instead,
          # with exit 100 and no result at all.
          sudo apt-get install -y --no-install-recommends passt nftables iproute2 jq >/dev/null || \
            echo "::warning::some egress packages are unavailable here; the suite will skip that section"
          sh tests/linux/verify_supervisor.sh
        env:
          SRC: ${{ github.workspace }}

      # The seccomp profile against real packages, and the examples run for
      # real. Both need the network; both are the checks that found the
      # `clone3` bug (docs/book/24-seccomp-profiles.md).
      - name: Seccomp compatibility matrix
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . tests/linux/ci_cgroup.sh
          sh tests/linux/seccomp_matrix.sh
        env:
          SRC: ${{ github.workspace }}

      # The same two profiles against Node, which reaches the kernel very
      # differently: libuv builds every pipe out of `socketpair()`, and this
      # is the check that found it missing from `strict`.
      - name: Seccomp compatibility matrix (Node)
        if: ${{ !cancelled() }}
        run: |
          . tests/linux/ci_cgroup.sh
          sh tests/linux/seccomp_matrix_node.sh
        env:
          SRC: ${{ github.workspace }}
          ZYGO_DATA_HOME: /tmp/zygo-matrix-node

      # `zygo login` against a real `registry:2` with htpasswd
      # authentication, in two containers sharing a network namespace. No
      # sandbox and no privileges, so it runs once rather than per matrix
      # entry: it is the client half of the image store and does not vary
      # with the kernel.
      - name: Registry credentials
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.privilege == 'rootless' }}
        run: |
          install -Dm755 target/release/zygo tests/linux/bin/zygo-linux-musl
          make verify-login-linux

      - name: Examples
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . tests/linux/ci_cgroup.sh
          (cd examples/warm-exec/go && CGO_ENABLED=0 go build -o bin/parse .) || echo "::warning::no Go toolchain; the Go example is skipped"
          sh tests/linux/verify_examples.sh
        env:
          SRC: ${{ github.workspace }}

  # Landlock's network rules, which need ABI v4 — kernel 6.7. No development
  # machine here has one: 5.10 reports ABI 0 and the Raspberry Pi's kernel does
  # not compile Landlock in at all, so `bind` and `connect` were built,
  # unit-tested and never once enforced. ubuntu-24.04 is 6.8.
  #
  # Its own job rather than a step in `launcher`, because it is the only check
  # in the tree whose whole point is the kernel version: a green tick here
  # means a kernel enforced the rules, and burying that in a job that also runs
  # on 22.04 would make the tick mean "skipped" half the time.
  landlock-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Let unprivileged user namespaces mount
        run: |
          before=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "not present")
          if [ "$before" != "not present" ] && [ "$before" != 0 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: What this runner's Landlock can do
        run: |
          echo "kernel: $(cat /proc/sys/kernel/osrelease)"
          echo "lsm:    $(cat /sys/kernel/security/lsm 2>/dev/null || echo '?')"

      - run: cargo build --release
      - run: sudo apt-get install -y --no-install-recommends passt nftables iproute2

      - name: bind and connect, refused by the kernel
        run: |
          . tests/linux/ci_cgroup.sh
          install -Dm755 target/release/zygo tests/linux/bin/zygo-linux
          sh tests/linux/verify_landlock_net.sh
        env:
          ZYGO: ${{ github.workspace }}/tests/linux/bin/zygo-linux
          ZYGO_DATA_HOME: /tmp/zygo-landlock
          SRC: ${{ github.workspace }}

  # Requirement N6: one static binary, no runtime dependencies, small enough to
  # `curl | sh`.
  static-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    name: static (${{ matrix.target }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }}

      # The same script `make dist-linux` and the release workflow run, so
      # there is one copy of the budget rather than three.
      - name: It must be static, and inside the size budget
        run: sh tests/linux/check_dist.sh target/${{ matrix.target }}/release/zygo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zygo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zygo

  # Zygo inside a container that is **not** privileged, which is how anybody
  # deploying it will run it. The whole job is the flag list: three things, no
  # `--privileged` and no added capabilities, measured rather than guessed.
  #
  #   seccomp=unconfined     Docker's default profile refuses
  #                          `unshare(CLONE_NEWUSER)`, which is what a sandbox
  #                          does first.
  #   systempaths=unconfined a masked `/proc` is not "fully visible", and the
  #                          kernel then refuses a fresh `proc` mount inside a
  #                          user namespace (`mount_too_revealing`). Without
  #                          this every sandbox dies on "mounting /proc
  #                          failed: Operation not permitted".
  #   a writable cgroup      the container's own subtree, and only that. The
  #                          usual `-v /sys/fs/cgroup:rw` hands over the
  #                          *host's* whole hierarchy, which is worse than the
  #                          privilege it avoids.
  #   apparmor=unconfined    on an AppArmor host, `docker-default` refuses
  #                          the mounts a sandbox makes.
  #
  # `docs/book/16-production.md` carries the same list, and `examples/kubernetes/` the same
  # thing as a `securityContext`.
  unprivileged-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: unprivileged container
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Let unprivileged user namespaces mount
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - run: cargo build --release
      - run: install -Dm755 target/release/zygo tests/linux/bin/zygo-linux-musl

      # The runner's Docker now uses the systemd cgroup driver, which takes a
      # slice rather than a path for `--cgroup-parent`. This job tests the
      # flags, not the driver, so it keeps the path form: back to cgroupfs.
      - name: Docker with the cgroupfs driver
        run: |
          cfg=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$cfg" | jq '. + {"exec-opts": ["native.cgroupdriver=cgroupfs"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'cgroup driver: {{.CgroupDriver}}'

      # A cgroup for the container, and nothing above it. `cgroup-parent` puts
      # the container's own cgroup underneath, and the bind makes exactly that
      # subtree writable inside.
      - name: A delegated cgroup subtree for the container
        run: |
          sudo mkdir -p /sys/fs/cgroup/zygo-unpriv
          for c in memory pids cpu; do
            echo "+$c" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null \
              || echo "::warning::this kernel will not delegate $c from the root"
          done
          cat /sys/fs/cgroup/zygo-unpriv/cgroup.controllers

      - name: What the container can do
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt systempaths=unconfined \
            --security-opt apparmor=unconfined \
            --cgroupns=host --cgroup-parent=/zygo-unpriv \
            -v /sys/fs/cgroup/zygo-unpriv:/sys/fs/cgroup/zygo-unpriv:rw \
            -v "$PWD:/src:ro" -e ZYGO_DATA_HOME=/tmp/zdata \
            python:3.12-slim /src/tests/linux/bin/zygo-linux-musl doctor

      - name: Supervisor lifecycle, unprivileged
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt systempaths=unconfined \
            --security-opt apparmor=unconfined \
            --cgroupns=host --cgroup-parent=/zygo-unpriv \
            -v /sys/fs/cgroup/zygo-unpriv:/sys/fs/cgroup/zygo-unpriv:rw \
            -v "$PWD:/src:ro" -e ZYGO_DATA_HOME=/tmp/zdata-sup \
            python:3.12-slim sh /src/tests/linux/verify_supervisor.sh

      - name: The HTTP API, unprivileged
        # Run even when the suite above failed: they test different things,
        # and one job that reports both is one round trip instead of two.
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt systempaths=unconfined \
            --security-opt apparmor=unconfined \
            --cgroupns=host --cgroup-parent=/zygo-unpriv \
            -v /sys/fs/cgroup/zygo-unpriv:/sys/fs/cgroup/zygo-unpriv:rw \
            -v "$PWD:/src:ro" -e ZYGO_DATA_HOME=/tmp/zdata-api \
            python:3.12-slim sh /src/tests/linux/verify_api.sh

      # The negative half: without the two `--security-opt`s, `zygo doctor`
      # has to *say so* rather than a sandbox dying four steps later with a
      # message about somebody else's bug. This is the check that keeps those
      # two lines of the report honest.
      - name: And a plain container is told why it cannot
        if: ${{ !cancelled() }}
        run: |
          out=$(docker run --rm -v "$PWD:/src:ro" -e ZYGO_DATA_HOME=/tmp/zd \
            python:3.12-slim /src/tests/linux/bin/zygo-linux-musl doctor 2>&1 || true)
          printf '%s\n' "$out"
          echo "$out" | grep -q "seccomp=unconfined" \
            || { echo "::error::doctor did not name the seccomp profile"; exit 1; }
          out=$(docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD:/src:ro" -e ZYGO_DATA_HOME=/tmp/zd \
            python:3.12-slim /src/tests/linux/bin/zygo-linux-musl doctor 2>&1 || true)
          printf '%s\n' "$out"
          echo "$out" | grep -q "apparmor=unconfined" \
            || { echo "::error::doctor did not name the AppArmor profile"; exit 1; }
          out=$(docker run --rm --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$PWD:/src:ro" -e ZYGO_DATA_HOME=/tmp/zd \
            python:3.12-slim /src/tests/linux/bin/zygo-linux-musl doctor 2>&1 || true)
          printf '%s\n' "$out"
          echo "$out" | grep -q "systempaths=unconfined" \
            || { echo "::error::doctor did not name the masked /proc"; exit 1; }

  # The Kubernetes example, applied to a real cluster. A manifest nobody runs
  # is a manifest that is wrong — the `securityContext` in this one is four
  # specific things, and three of them are the difference between a pod that
  # serves and a pod that fails at its first request.
  #
  # kind, because it is a real kubelet with a real container runtime on a
  # runner that has neither. The check at the end is a **sandbox running
  # inside the pod**, through the API, which is what the manifest is for.
  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: kubernetes (kind)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Let unprivileged user namespaces mount
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - run: cargo build --release --target x86_64-unknown-linux-musl || cargo build --release
      - name: The image, from the binary this job built
        run: |
          binary=target/x86_64-unknown-linux-musl/release/zygo
          [ -f "$binary" ] || binary=target/release/zygo
          install -m 0755 "$binary" packaging/oci/zygo
          docker build -f packaging/oci/Dockerfile -t zygo:ci packaging/oci

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1
        with:
          config: examples/kubernetes/kind.yaml
          cluster_name: zygo

      - run: kind load docker-image zygo:ci --name zygo

      # The example, with two edits a cluster of one node needs — the image
      # this job built, and one replica rather than two — and the two values
      # every operator fills in. The placeholder key is refused, as it should
      # be, and the supervisor does not start with it.
      - name: Apply the example
        run: |
          key=$(packaging/oci/zygo secrets keygen 2>/dev/null)
          sed -e 's|ghcr.io/mhmtskrc2/zygo:latest|zygo:ci|' \
              -e 's|replicas: 2|replicas: 1|' \
              -e "s|replace-me-with-zygo-secrets-keygen|$key|" \
              -e "s|replace-me-with-32-random-bytes|$(openssl rand -hex 32)|" \
              examples/kubernetes/deployment.yaml > /tmp/zygo.yaml
          kubectl apply -f /tmp/zygo.yaml
          kubectl -n zygo rollout status deployment/zygo --timeout=5m

      - name: What the pod says about its host
        run: kubectl -n zygo exec deploy/zygo -- zygo doctor || true

      # The check the manifest exists for. A warm-exec pool on `alpine:3`
      # rather than an interpreter: it exercises the whole path — warm
      # sandbox, script written in, request forked, cgroup per request — and
      # needs a 3 MB image rather than a 45 MB one.
      #
      # `zygo agent test` would be the letter of the roadmap item and less of
      # a check: the image ships no interpreter to run an agent with, and
      # putting one in it to satisfy a test would be testing the test.
      # The check the manifest exists for. A warm-exec pool on `alpine:3`
      # rather than an interpreter: it exercises the whole path — warm
      # sandbox, script written into it, request forked, cgroup per request —
      # and needs a 3 MB image rather than a 45 MB one.
      #
      # `zygo agent test` would be the letter of the roadmap item and less of
      # a check: the image ships no interpreter to run an agent with, and
      # putting one in it to satisfy a test would be testing the test.
      #
      # Driven from outside through `port-forward`, because a check written
      # as a shell string inside `kubectl exec` is three levels of quoting and
      # one of them is always wrong.
      - name: A sandbox, inside the pod
        run: |
          set -eux
          kubectl -n zygo exec deploy/zygo -- zygo pull alpine:3
          kubectl -n zygo port-forward svc/zygo 7700:7700 &
          forward=$!
          trap 'kill $forward' EXIT
          for _ in $(seq 40); do
            curl -fsS http://127.0.0.1:7700/healthz && break || sleep 0.5
          done
          token=$(kubectl -n zygo get secret zygo -o jsonpath='{.data.api-token}' | base64 -d)

          # A pool with a `cmd` and no agent: warm-exec, where each request's
          # script is the last word of the command line.
          curl -fsS -X POST http://127.0.0.1:7700/runtimes \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"name":"sh","layer":{"image":"alpine:3","cmd":["/bin/sh"],"timeout":"20s"}}'

          # In a quoted heredoc, so the shell touches none of it: the script
          # is a JSON string containing a shell script containing quotes, and
          # every level of that escaped inline is one somebody gets wrong.
          cat > /tmp/request.json <<'JSON'
          {"script": {"source": "read -r event\nprintf '{\"from\": \"the-pod\"}\\n'\n"}, "event": {}}
          JSON
          curl -fsS -X POST http://127.0.0.1:7700/runtimes/sh/call \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d @/tmp/request.json | tee /tmp/call.json
          grep -q 'the-pod' /tmp/call.json

      # Readiness has to go red while a pod drains, or a rolling restart sends
      # requests to a pod that is leaving. `POST /drain` is what `preStop`
      # calls; this is the same call, watched from outside.
      - name: Draining takes it out of the endpoints
        run: |
          kubectl -n zygo exec deploy/zygo -- sh -c '
            wget -q -O- --post-data="" --header="Authorization: Bearer $ZYGO_API_TOKEN" \
              "http://127.0.0.1:7700/drain?grace_ms=5000"' || true
          sleep 8
          kubectl -n zygo get endpoints zygo -o yaml
          kubectl -n zygo rollout status deployment/zygo --timeout=3m

      - name: What happened, if anything did not
        if: failure()
        run: |
          kubectl -n zygo get pods -o wide
          kubectl -n zygo describe pods
          kubectl -n zygo logs deploy/zygo --tail=100 || true

  # The seccomp syscall numbers are generated from each architecture's headers.
  # A profile that gained a syscall without regenerating them would silently
  # drop it from the filter, so the committed tables are checked against a
  # fresh generation.
  syscall-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3    # for the non-native architecture
      - run: python3 tools/gen_syscall_tables.py
      - name: The committed tables must match
        run: |
          git diff --exit-code crates/zygo-core/src/backend/ns/syscalls.rs \
            || { echo "::error::run 'make syscall-tables' and commit the result"; exit 1; }

  # Known gaps that need hardware CI does not always have. Informational until
  # a suitable runner exists.
  pending-hardware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: What is still unverified
        run: |
          echo "KVM (the vm backend, PoC 8): $([ -e /dev/kvm ] && echo present || echo ABSENT)"
          echo "Landlock:                    $(grep -o landlock /sys/kernel/security/lsm 2>/dev/null || echo ABSENT)"
          echo
          echo "Landlock's network rules have a job of their own now"
          echo "(landlock-network, on ubuntu-24.04 / 6.8): it proves a bind and an"
          echo "off-list connect are refused by *Landlock* rather than by nftables,"
          echo "by picking two cases nftables cannot account for — a bind, which"
          echo "sends no packet, and a loopback connect, which the filter accepts"
          echo "on its first line. Neither development machine can run them: 5.10"
          echo "reports ABI 0 and the Raspberry Pi's kernel does not compile"
          echo "Landlock in at all."
          echo
          echo "KVM is the one with no home yet: the vm backend needs a runner"
          echo "that exposes /dev/kvm, and no hosted one does."
