name: ci

# The matrix exists because the development machines cannot test several
# things: the
# measurement environment was kernel 5.10 without KVM, so Landlock, cgroup.kill,
# memory.peak, unprivileged overlayfs and the `vm` backend were never exercised.
# Each of those has a job here that will exercise it, and the kernel each runner
# provides is printed so a green tick can be checked rather than trusted.

on:
  push:
    branches: [main]
  pull_request:
  # Several jobs here depend on what a runner happens to provide — a kernel
  # version, a `/dev/kvm`, a working `runsc` download. Being able to re-run
  # the matrix without an empty commit is worth one line.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege by default (S-13). Without this the token is whatever the
# repository's default is, which for many repositories is write — handed to
# every third-party action in every job. A job that needs more asks for it.
permissions:
  contents: read

# One run per ref. A push that supersedes another cancels it rather than
# queueing behind it, which on a repository with long Linux jobs is the
# difference between minutes and an hour.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything platform independent: spec, protocol, image store, mount plan.
  # Runs on macOS too, because that is where most development happens and the
  # Linux-only code must keep compiling there.
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04      # kernel 6.8 — Landlock v4+, cgroup.kill
            label: linux/x86_64
          - os: ubuntu-22.04      # kernel 5.15 — the oldest supported
            label: linux/x86_64/old
          - os: ubuntu-24.04-arm
            label: linux/aarch64
          - os: macos-14
            label: macos/aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: unit (${{ matrix.label }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Report what this runner actually is
        run: |
          uname -a
          if [ -f /proc/sys/kernel/osrelease ]; then
            echo "kernel: $(cat /proc/sys/kernel/osrelease)"
            echo "userns: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo '?')"
            echo "cgroup: $(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo 'not v2')"
            echo "lsm:    $(cat /sys/kernel/security/lsm 2>/dev/null || echo '?')"
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Python agent unit tests
        run: python3 -W error::ResourceWarning -m unittest discover -s agents/python

      # The protocol's own suite, against both reference agents. The `sh` one
      # shares no code with Zygo, which is what makes "language independent"
      # something other than an assertion.
      - name: Protocol conformance
        run: make conformance

      # The third implementation, and the one that cannot `fork()`: the Node
      # agent keeps a pool of pre-loaded workers instead. `make
      # conformance-node` runs it in a container because the musl binary has
      # to cross into `node:22-slim`; on a runner that already has Node there
      # is nothing to cross.
      - name: Protocol conformance (Node)
        shell: bash
        run: |
          if ! command -v node >/dev/null; then
            echo "no node on this runner — skipped"
            exit 0
          fi
          ./target/release/zygo agent test node \
            --script examples/agents/conformance/script.js \
            --script-spawn examples/agents/conformance/spawn.js -- \
            agents/node/zygo_agent.js examples/agents/conformance/handler.js

      # The macOS shim, end to end against a real Linux VM. It will skip here
      # and say so: GitHub's hosted macOS runners are themselves virtual
      # machines and offer no nested virtualization, so Lima cannot boot. The
      # shim's own decisions — what forwards, what a path maps to, what
      # `limactl` is asked — are plain functions covered by `cargo test`
      # above, on every platform in the matrix.
      - name: macOS shim
        if: runner.os == 'macOS'
        run: make verify-shim

  # The launcher can only be exercised on Linux, and the interesting question is
  # whether it works *without* root — requirement N5.
  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            privilege: rootless
          - os: ubuntu-24.04
            privilege: root
          - os: ubuntu-22.04
            privilege: rootless
          - os: ubuntu-24.04-arm
            privilege: rootless
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: launcher (${{ matrix.os }}, ${{ matrix.privilege }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`.
      # It lets an unprivileged process create a user namespace and then
      # refuses the first mount inside it, so every sandbox dies on `mount
      # --make-rprivate /: Permission denied` — which names neither AppArmor
      # nor user namespaces. `zygo doctor` reports it now; this turns it off,
      # because this runner exists to run sandboxes and the confinement that
      # matters is the one Zygo builds inside them.
      - name: Let unprivileged user namespaces mount
        run: |
          before=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "not present")
          echo "apparmor_restrict_unprivileged_userns was: $before"
          if [ "$before" != "not present" ] && [ "$before" != 0 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Environment
        run: |
          cargo run --release --bin zygo -- doctor || true
          echo "subuid: $(grep "^$USER:" /etc/subuid 2>/dev/null || echo 'none')"

      - run: cargo build --release

      # The scripts default to `/src`, which is where `make` mounts the
      # checkout inside its containers; here the checkout is the workspace.
      - name: Isolation and limits
        run: |
          . poc/ci_cgroup.sh
          install -m 0755 target/release/zygo poc/zygo-linux
          if [ "${{ matrix.privilege }}" = root ]; then
            sudo -E sh poc/verify_launcher.sh
          else
            sh poc/verify_launcher.sh
          fi
        env:
          # Its own tree, because the root entry runs this one step under
          # `sudo` and every step after it unprivileged. Sharing one directory
          # left those steps unable to write it — and an escape suite that
          # cannot start a sandbox reported *16 escapes*.
          ZYGO_DATA_HOME: /tmp/zygo-launcher-${{ matrix.privilege }}
          SRC: ${{ github.workspace }}

      - name: Escape suite
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . poc/ci_cgroup.sh
          install -m 0755 target/release/zygo poc/zygo-linux
          sh poc/escape_suite.sh
        env:
          ZYGO_DATA_HOME: /tmp/zygo-ci
          SRC: ${{ github.workspace }}

      # Every syscall number against all three profiles, comparing what the
      # kernel answered. The escape suite attempts the vectors somebody
      # thought of; this one needs no imagination.
      - name: Syscall sweep
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . poc/ci_cgroup.sh
          bash poc/fuzz_syscalls.sh
        env:
          ZYGO_DATA_HOME: /tmp/zygo-ci
          SRC: ${{ github.workspace }}

      # The gvisor backend against a real runsc, including the same command
      # run on both backends (requirement N8). Downloads ~114 MB.
      - name: gVisor backend
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . poc/ci_cgroup.sh
          sh poc/verify_gvisor.sh
        env:
          ZYGO_DATA_HOME: /tmp/zygo-gvisor
          SRC: ${{ github.workspace }}

      # The only suite where the client process exits between steps, which is
      # what catches failures living in the supervisor's threading rather than
      # in the sandbox — `PDEATHSIG` firing on thread exit was found this way
      # and no in-process test can see it.
      - name: Supervisor lifecycle
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . poc/ci_cgroup.sh
          install -m 0755 target/release/zygo poc/zygo-linux
          # Not fatal: `passt` is not packaged before Ubuntu 23.04, and the
          # suite has a prerequisite check that skips the egress section and
          # says so. A failed `apt-get` here ended the whole step instead,
          # with exit 100 and no result at all.
          sudo apt-get install -y --no-install-recommends passt nftables iproute2 jq >/dev/null || \
            echo "::warning::some egress packages are unavailable here; the suite will skip that section"
          sh poc/verify_supervisor.sh
        env:
          SRC: ${{ github.workspace }}

      # The seccomp profile against real packages, and the examples run for
      # real. Both need the network; both are the checks that found the
      # `clone3` bug (docs/seccomp-profiles.md).
      - name: Seccomp compatibility matrix
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . poc/ci_cgroup.sh
          sh poc/seccomp_matrix.sh
        env:
          SRC: ${{ github.workspace }}

      # The same two profiles against Node, which reaches the kernel very
      # differently: libuv builds every pipe out of `socketpair()`, and this
      # is the check that found it missing from `strict`.
      - name: Seccomp compatibility matrix (Node)
        if: ${{ !cancelled() }}
        run: |
          . poc/ci_cgroup.sh
          sh poc/seccomp_matrix_node.sh
        env:
          SRC: ${{ github.workspace }}
          ZYGO_DATA_HOME: /tmp/zygo-matrix-node

      # `zygo login` against a real `registry:2` with htpasswd
      # authentication, in two containers sharing a network namespace. No
      # sandbox and no privileges, so it runs once rather than per matrix
      # entry: it is the client half of the image store and does not vary
      # with the kernel.
      - name: Registry credentials
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.privilege == 'rootless' }}
        run: |
          install -m 0755 target/release/zygo poc/zygo-linux
          make verify-login-linux

      - name: Examples
        # Run even when an earlier suite failed: they test different
        # things, and one job that reports all of them is one round trip
        # instead of six. The job still fails.
        if: ${{ !cancelled() }}
        run: |
          . poc/ci_cgroup.sh
          (cd examples/warm-exec/go && CGO_ENABLED=0 go build -o bin/parse .) || echo "::warning::no Go toolchain; the Go example is skipped"
          sh poc/verify_examples.sh
        env:
          SRC: ${{ github.workspace }}

  # Landlock's network rules, which need ABI v4 — kernel 6.7. No development
  # machine here has one: 5.10 reports ABI 0 and the Raspberry Pi's kernel does
  # not compile Landlock in at all, so `bind` and `connect` were built,
  # unit-tested and never once enforced. ubuntu-24.04 is 6.8.
  #
  # Its own job rather than a step in `launcher`, because it is the only check
  # in the tree whose whole point is the kernel version: a green tick here
  # means a kernel enforced the rules, and burying that in a job that also runs
  # on 22.04 would make the tick mean "skipped" half the time.
  landlock-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Let unprivileged user namespaces mount
        run: |
          before=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "not present")
          if [ "$before" != "not present" ] && [ "$before" != 0 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: What this runner's Landlock can do
        run: |
          echo "kernel: $(cat /proc/sys/kernel/osrelease)"
          echo "lsm:    $(cat /sys/kernel/security/lsm 2>/dev/null || echo '?')"

      - run: cargo build --release
      - run: sudo apt-get install -y --no-install-recommends passt nftables iproute2

      - name: bind and connect, refused by the kernel
        run: |
          . poc/ci_cgroup.sh
          install -m 0755 target/release/zygo poc/zygo-linux
          sh poc/verify_landlock_net.sh
        env:
          ZYGO: ${{ github.workspace }}/poc/zygo-linux
          ZYGO_DATA_HOME: /tmp/zygo-landlock
          SRC: ${{ github.workspace }}

  # Requirement N6: one static binary, no runtime dependencies, small enough to
  # `curl | sh`.
  static-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    name: static (${{ matrix.target }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }}

      # The same script `make dist-linux` and the release workflow run, so
      # there is one copy of the budget rather than three.
      - name: It must be static, and inside the size budget
        run: sh poc/check_dist.sh target/${{ matrix.target }}/release/zygo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zygo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zygo

  # The seccomp syscall numbers are generated from each architecture's headers.
  # A profile that gained a syscall without regenerating them would silently
  # drop it from the filter, so the committed tables are checked against a
  # fresh generation.
  syscall-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3    # for the non-native architecture
      - run: python3 poc/gen_syscall_tables.py
      - name: The committed tables must match
        run: |
          git diff --exit-code crates/zygo-core/src/backend/ns/syscalls.rs \
            || { echo "::error::run 'make syscall-tables' and commit the result"; exit 1; }

  # Known gaps that need hardware CI does not always have. Informational until
  # a suitable runner exists.
  pending-hardware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: What is still unverified
        run: |
          echo "KVM (the vm backend, PoC 8): $([ -e /dev/kvm ] && echo present || echo ABSENT)"
          echo "Landlock:                    $(grep -o landlock /sys/kernel/security/lsm 2>/dev/null || echo ABSENT)"
          echo
          echo "Landlock's network rules have a job of their own now"
          echo "(landlock-network, on ubuntu-24.04 / 6.8): it proves a bind and an"
          echo "off-list connect are refused by *Landlock* rather than by nftables,"
          echo "by picking two cases nftables cannot account for — a bind, which"
          echo "sends no packet, and a loopback connect, which the filter accepts"
          echo "on its first line. Neither development machine can run them: 5.10"
          echo "reports ABI 0 and the Raspberry Pi's kernel does not compile"
          echo "Landlock in at all."
          echo
          echo "KVM is the one with no home yet: the vm backend needs a runner"
          echo "that exposes /dev/kvm, and no hosted one does."
