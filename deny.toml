# cargo-deny: what the dependency tree may contain. Run with `make deny`;
# CI runs it on every push and pull request.
#
# A sandbox is only as trustworthy as the code linked into it, and 280-odd
# crates is a lot of code nobody here wrote. This does not read that code; it
# refuses the three things a machine can check — a crate with a published
# advisory, a licence Apache-2.0 cannot ship, and a crate from somewhere other
# than crates.io.

[graph]
# Only the platforms a release is built for.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# Every advisory is an error, unmaintained crates included, unless it is
# listed below with the reason it does not apply.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only: everything here ends up in a static binary
# distributed under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: a licence nothing uses today is
# still one a new dependency may use.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies carry a version as well, so they are
# not wildcards; this keeps them from being reported as such.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The one git source: libkrun, pinned to a tag in `[patch.crates-io]` and only
# linked with the optional `vm` feature. See the workspace Cargo.toml.
allow-git = ["https://github.com/containers/libkrun.git"]
# Without the `vm` feature libkrun is not in the graph at all.
unused-allowed-source = "allow"
