[package]
name = "zygo-core"
description = "Daemonless, rootless, OCI-compatible warm sandbox runtime — core library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["sandbox", "container", "seccomp", "namespaces", "serverless"]
categories = ["virtualization", "os::linux-apis", "development-tools"]
# The agents are reached through `agents`, a symlink to the repository's own
# `agents/` directory, because `include_str!` has to stay inside the package
# root for `cargo install` to work. The tests and the compiled Python beside
# them are not part of the library.
exclude = [
    "agents/**/__pycache__/**",
    "agents/**/test_*.py",
    "agents/**/*.test.js",
]

# The lint table is the workspace's, in the root `Cargo.toml`, so both crates
# are held to one policy.
[lints]
workspace = true

[features]
default = ["registry"]
# OCI Distribution client. Disabled builds can still use a pre-populated image
# store, which keeps the dependency surface (TLS, HTTP) out of embedders that
# pull images by other means.
registry = ["dep:reqwest", "dep:futures-util", "dep:tokio"]
# The `vm` backend. Off by default: it links a virtual machine monitor, and a
# host without KVM cannot use one. `make vm-build` is the build that turns it
# on, and `zygo doctor` says what is missing when it is not compiled in.
vm = ["dep:libkrun"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
base64.workspace = true
tar.workspace = true
flate2.workspace = true
ruzstd.workspace = true

reqwest = { workspace = true, optional = true }
libkrun = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
