[package]
name = "zygo-core"
description = "Daemonless, rootless, OCI-compatible warm sandbox runtime — core library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["registry"]
# OCI Distribution client. Disabled builds can still use a pre-populated image
# store, which keeps the dependency surface (TLS, HTTP) out of embedders that
# pull images by other means.
registry = ["dep:reqwest", "dep:futures-util", "dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
tar.workspace = true
flate2.workspace = true
ruzstd.workspace = true

reqwest = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
