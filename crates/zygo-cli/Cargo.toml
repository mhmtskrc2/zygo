[package]
name = "zygo-cli"
description = "zygo — a daemonless, rootless warm sandbox runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["sandbox", "container", "seccomp", "namespaces", "serverless"]
categories = ["command-line-utilities", "virtualization", "os::linux-apis"]

# The lint table is the workspace's, in the root `Cargo.toml`, so both crates
# are held to one policy.
[lints]
workspace = true

[[bin]]
name = "zygo"
path = "src/main.rs"

[dependencies]
zygo-core.workspace = true

anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
# `POST /run` hands the sandbox to a child `zygo run` as a spec file, which is
# the one place the CLI writes TOML rather than reading it.
toml.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
# OTLP export from `zygo api`, and the runsc download. Already in the tree
# through zygo-core's registry client, so these are names, not dependencies.
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
# `zygo agent test` hands the `strict` child filter over the way the
# supervisor does: base64 of the raw program.
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# `tempfile` is a real dependency of this crate (`cmd/oneshot.rs`,
# `cmd/mcp.rs`), so it is not repeated here.
