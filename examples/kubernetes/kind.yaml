# A kind cluster that can run the deployment beside this file.
#
# One node, and one thing it needs beyond the default: cgroup v2. kind's node
# image uses whatever the host does; on a host still on v1 nothing here works,
# and `zygo doctor` says so rather than failing mysteriously.
#
# Used by the `kubernetes` CI job. A real cluster does not need this file — it
# needs the same property.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
