# n8n in external task-runner mode, for the comparison in README.md.
#   docker compose up -d n8n                   n8n alone; a runner connects from outside
#   docker compose --profile stock up -d       n8n and the stock n8nio/runners sidecar
# stack.sh writes .env: the broker's token, where the broker listens, which
# runner config the stock sidecar reads.
services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.38.7}
    container_name: n8n
    ports:
      - "5678:5678"
      - "${BROKER_BIND:-127.0.0.1}:5679:5679"
    environment:
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_TASK_TIMEOUT=60
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_SECURE_COOKIE=false
      - N8N_LOG_LEVEL=warn
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
  runners:
    profiles: ["stock"]
    image: n8nio/runners:${N8N_VERSION:-2.38.7}
    container_name: n8n-runners
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_MAX_CONCURRENCY=5
      - N8N_RUNNERS_TASK_TIMEOUT=60
    volumes:
      - ./${RUNNERS_JSON:-n8n-task-runners.json}:/etc/n8n-task-runners.json:ro
    depends_on: [n8n]
volumes:
  n8n_data: {}
