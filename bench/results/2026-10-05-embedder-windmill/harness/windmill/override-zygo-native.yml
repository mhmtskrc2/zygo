# Windmill's general workers with Zygo where nsjail was, with no script between them:
# the zygo binary itself is mounted as `nsjail`, and when started under that name it
# reads nsjail's command line and config (see crates/zygo-cli/src/cmd/nsjail.rs).
# The entrypoint first moves the worker's own processes into a child cgroup, as docker:dind
# does, so the container's cgroup root can pass controllers down to Zygo's sandboxes.
services:
  windmill_worker:
    entrypoint: ["sh", "-c", "mkdir -p /sys/fs/cgroup/init && for p in $$(cat /sys/fs/cgroup/cgroup.procs); do echo $$p > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null; done; exec windmill"]
    environment:
      - DISABLE_NSJAIL=false
      - KEEP_JOB_DIR=${KEEP_JOB_DIR:-false}
    # From the VM's own disk, not the Mac's: a binary on virtiofs loses its page cache
    # between runs and is faulted in again on every exec.
    volumes:
      - /opt/zygo-bench/zygo:/usr/local/bin/nsjail:ro
      - /opt/zygo-bench/zygo:/usr/local/bin/zygo:ro
      - zygo_store:/zygo-data
      - /opt/zygo-bench/nsjail-native.env:/etc/zygo/nsjail.env:ro
volumes:
  zygo_store: null
