# Windmill's general workers with Zygo where nsjail was: the worker runs its jobs through
# nsjail (DISABLE_NSJAIL=false), and `nsjail` on PATH is a stand-in that calls `zygo run`.
# The entrypoint first moves the worker's own processes into a child cgroup, as docker:dind
# does, so the container's cgroup root can pass controllers down to Zygo's sandboxes.
services:
  windmill_worker:
    entrypoint: ["sh", "-c", "mkdir -p /sys/fs/cgroup/init && for p in $$(cat /sys/fs/cgroup/cgroup.procs); do echo $$p > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null; done; exec windmill"]
    environment:
      - DISABLE_NSJAIL=false
      - ZYGO_DATA_HOME=/zygo-data
      - ZYGO_NET=${ZYGO_NET:-full}
      - KEEP_JOB_DIR=${KEEP_JOB_DIR:-false}
    # The binaries come from the VM's own disk, /opt/zygo-bench (copied there by
    # `install`), not from the Mac: a file on virtiofs loses its page cache between
    # runs, and an 8 MB static binary faulted in and its instruction cache flushed on
    # every exec cost Zygo 5 ms of every job that nsjail, installed in the image, never
    # paid.
    volumes:
      - /opt/zygo-bench/zygo:/usr/local/bin/zygo:ro
      - /opt/zygo-bench/nsjail:/usr/local/bin/nsjail:ro
      - zygo_store:/zygo-data
      - /opt/zygo-bench/zygo-nsjail.env:/etc/zygo-nsjail.env:ro
volumes:
  zygo_store: null
