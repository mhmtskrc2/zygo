# musl builds assert the musl they link against is 1.2.3 or newer.
#
# This is not Zygo's own requirement. libkrun's virtiofs passthrough calls
# `libc::statx`, and `libc` hides that behind `--cfg musl_v1_2_3` because
# older musl did not have it. libkrun sets exactly this flag in its own
# `.cargo/config.toml` — which applies only when cargo runs inside *its*
# directory tree, so a project that depends on libkrun as a git dependency
# does not inherit it and fails to compile `krun-devices` with four
# "cannot find `statx` in crate `libc`" errors.
#
# That is the whole difference between `cargo build -p libkrun` inside
# libkrun's repository, which works, and the same source built as our
# dependency, which did not. It cost an afternoon to find, so it is written
# down here rather than rediscovered.
#
# The assertion is true where Zygo builds: Alpine has shipped musl 1.2.x since
# 3.12, and `make poc/zygo-linux-musl` builds in `rust:1-alpine`. A host with
# musl older than 1.2.3 is not one this project supports.
[target.'cfg(target_env = "musl")']
rustflags = ["--cfg", "musl_v1_2_3"]
