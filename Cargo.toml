[workspace]
resolver = "3"
members = ["crates/zygo-core", "crates/zygo-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# 1.88, not 1.85: let-chains (`if let .. && ..`) are used throughout and were
# stabilised in 1.88. The declared floor was wrong until a machine with an
# older toolchain tried to build it — `cargo check` on the machine that wrote
# it passed because that machine was newer, which is how an MSRV drifts.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/mhmtskrc2/zygo"
authors = ["Zygo contributors"]

[workspace.dependencies]
zygo-core = { path = "crates/zygo-core", version = "0.1.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11"
hex = "0.4"
# Secrets at rest. RustCrypto, pure Rust, and the same family as
# `sha2` above — a cipher is the one thing this project will not write itself,
# and a C dependency would complicate the static musl build the distribution
# rests on. `zeroize` so a key does not outlive its use in this process's heap.
#
# Not the only word on C, though: `reqwest`'s rustls pulls in `ring`, which is
# C and assembly. It builds statically against musl — the release checks that
# — so the rule is "no C this project adds by choice", not "no C at all".
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
base64 = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# The HTTP API. hyper is already in the tree through reqwest, so the server
# side costs code, not a new dependency.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
anyhow = "1"
# `event` is `poll`, which is how the launcher bounds its wait for a sandbox
# to start: a pipe has no read timeout.
rustix = { version = "1", features = ["fs", "process", "thread", "mount", "pipe", "net", "system", "event"] }
libc = "0.2"
tempfile = "3"

# The `vm` backend's virtual machine monitor, linked *into* the binary rather
# than loaded as a shared object: libkrun exports a C ABI from a Rust crate, so
# a cargo dependency and an rlib are the whole mechanism. Optional and off by
# default — it is a large tree, and a host without KVM has no use for it.
#
# A plain version here and the git source in `[patch.crates-io]` below, rather
# than the git source here: a published crate may not name a git dependency,
# and `cargo install zygo-cli` has to work. In this workspace the patch takes
# over, so the build is from the pinned tag; the range is what a crates.io
# consumer who turns the feature on would get, and 1.19.4 is not published
# there — `make vm-build` from a checkout is the supported way to build it.
libkrun = { version = "1.19" }

# Where `libkrun` actually comes from in this workspace. `[patch]` is a
# workspace-root section and is not part of any published manifest, so it
# redirects the build here without following the crate to crates.io.
#
# Pinned to a tag, and to one whose musl build was measured: see `make vm-build`.
[patch.crates-io]
libkrun = { git = "https://github.com/containers/libkrun.git", tag = "v1.19.4" }

# What the code is held to. CI and `make lint` run
# `cargo clippy --workspace --all-targets -- -D warnings`, so `warn` here is
# a failure there; this table writes that policy down instead of leaving it
# to whatever the toolchain's defaults happen to be. Each crate opts in with
# `[lints] workspace = true`.
#
# Deliberately not on, and why:
#
# * `rust.missing_docs` — about a quarter of the public items have no doc
#   comment. Turning it on today would mean a few hundred "the name says it"
#   lines; it goes on when the pass that writes real ones lands.
# * `clippy.unwrap_used`, `expect_used` — `--all-targets` lints the tests,
#   and a test that cannot `unwrap` is a worse test.
# * `clippy.mem_forget` — `mem::forget` is used on purpose, where a `Drop`
#   must not run; each site says why.
# * `rust.unused_qualifications`, `clippy.manual_let_else`,
#   `rust.trivial_numeric_casts`, `clippy.semicolon_if_nothing_returned`,
#   `clippy.large_stack_arrays`, `clippy.inefficient_to_string` — tried on
#   2026-09-26 and not clean (51, 6, 4, 1, 1 and 5 sites; the last five only
#   show on Linux, which is why a lint is checked there before it lands
#   here). Style, not correctness; nobody is rewriting sixty lines for a
#   table entry.
[workspace.lints.rust]
# The 2024 edition's default, made explicit: the body of an `unsafe fn` is
# not an `unsafe` block, so every unsafe operation in one is marked itself.
unsafe_op_in_unsafe_fn = "warn"
unused_import_braces = "warn"

[workspace.lints.clippy]
# Debugging leftovers: none of these belongs in a commit.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Every `unsafe` block and `unsafe impl` carries a `// SAFETY:` comment that
# says which invariant makes it sound — which pointer is live, which
# descriptor is owned, why a fork child may call it. Most of the sites are
# Linux-only, so `make lint` on a Mac sees a fraction of them; CI's Linux
# clippy job is the one that enforces this.
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
