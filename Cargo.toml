[workspace]
resolver = "3"
members = ["crates/zygo-core", "crates/zygo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88, not 1.85: let-chains (`if let .. && ..`) are used throughout and were
# stabilised in 1.88. The declared floor was false until the 2026-09-21 review
# (C-01) — `cargo check` on the machine that wrote it passed because that
# machine was newer, which is how an MSRV drifts.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/zygo-dev/zygo"
authors = ["Zygo contributors"]

[workspace.dependencies]
zygo-core = { path = "crates/zygo-core", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# The HTTP API. hyper is already in the tree through reqwest, so the server
# side costs code, not a new dependency.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.7"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
anyhow = "1"
# `event` is `poll`, which is how the launcher bounds its wait for a sandbox
# to start: a pipe has no read timeout.
rustix = { version = "1", features = ["fs", "process", "thread", "mount", "pipe", "net", "system", "event"] }
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
