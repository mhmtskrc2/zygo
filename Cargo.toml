[workspace]
resolver = "3"
members = ["crates/zygo-core", "crates/zygo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/zygo-dev/zygo"
authors = ["Zygo contributors"]

[workspace.dependencies]
zygo-core = { path = "crates/zygo-core", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.7"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
anyhow = "1"
rustix = { version = "1", features = ["fs", "process", "thread", "mount", "pipe", "net", "system"] }
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
